info:
  name: 4 Ver por id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/students/{{studentId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
