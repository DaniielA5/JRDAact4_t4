info:
  name: 5 Crear
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/v1/students
  body:
    type: json
    data: |-
      {
        "firstName": "Maria",
        "lastName": "Gomez",
        "email": "maria.gomez@correo.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("studentId", res.body.studentId);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
