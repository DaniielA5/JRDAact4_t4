info:
  name: 2 Login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/auth/login
  body:
    type: json
    data: |-
      {
        "email": "bruno@correo.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
