info:
  name: 01 Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/auth/register
  body:
    type: json
    data: |-
      {
        "name": "Usuario Dem",
        "email": "usuario.dem@correo.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
